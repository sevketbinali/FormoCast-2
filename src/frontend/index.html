<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FormoCast - Geçmiş Formasyon Analizi</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://unpkg.com/lightweight-charts@3.8.0/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body>
    <div class="background-elements">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <div class="container">
        <header class="header">
            <div class="logo">
                <span class="logo-icon">📊</span>
                <h1>FormoCast</h1>
            </div>
            <p class="subtitle">BIST 20 Yıllık Formasyon Simülasyonu ve Fiyat Hedefi Öngörüleri</p>
        </header>

        <main class="main-content">
            <div class="dashboard-layout">
                <aside class="sidebar glass-panel">
                    <h3>Hisse Seçin</h3>
                    <ul id="tickerList" class="ticker-list">
                        <li class="loading-text">Yükleniyor...</li>
                    </ul>
                </aside>

                <section class="dashboard-main glass-panel">
                    <div class="dashboard-header">
                        <h2 id="currentTickerTitle">Hisse Seçiniz</h2>
                        <div id="loader" class="loader" style="display: none;"></div>
                    </div>
                    
                    <div id="chartContainer" class="chart-container"></div>
                    
                    <div id="patternDetails" class="pattern-details" style="display:none;">
                        <h3>Formasyon Öngörüsü (Geçmişe Yönelik)</h3>
                        <div class="details-grid">
                            <div class="detail-item"><strong>Tip:</strong> <span id="pType"></span></div>
                            <div class="detail-item"><strong>Oluşum Tarihi:</strong> <span id="pDate"></span></div>
                            <div class="detail-item"><strong>Oluşum Fiyatı:</strong> <span id="pPrice"></span></div>
                            <div class="detail-item"><strong>Öngörülen Yön:</strong> <span id="pDirection"></span></div>
                            <div class="detail-item"><strong>Hedef Fiyat:</strong> <span id="pTargetPrice"></span></div>
                            <div class="detail-item"><strong>Hedef Tarih:</strong> <span id="pTargetDate"></span></div>
                        </div>
                    </div>
                    
                    <div id="patternsListContainer" class="patterns-list-container">
                        <h3>Tespit Edilen Formasyonlar</h3>
                        <div id="patternsList" class="patterns-list"></div>
                    </div>
                </section>
            </div>
        </main>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
