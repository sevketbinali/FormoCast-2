<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FormoCast - Canlı Piyasa Analizi</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="background-elements">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <div class="container">
        <header class="header">
            <div class="logo">
                <span class="logo-icon">📊</span>
                <h1>FormoCast</h1>
            </div>
            <p class="subtitle">BIST Hisse Senetleri Canlı Formasyon ve Sinyal Tarayıcısı</p>
        </header>

        <main class="main-content">
            <div class="control-panel glass-panel">
                <h2>Piyasa Tarayıcı</h2>
                <p>Belirlenen BIST havuzundaki hisseler anlık olarak taranır ve geçmiş backtest istatistikleriyle birlikte canlı formasyon fırsatları aşağıda listelenir.</p>
                <button id="scanBtn" class="btn-primary">
                    <span class="btn-text">Taramayı Başlat</span>
                    <span class="btn-loader" style="display: none;">🔄</span>
                </button>
            </div>

            <div class="results-container">
                <div class="status-indicator">
                    <div id="statusDot" class="dot"></div>
                    <span id="statusText">Sistem Hazır. Tarama bekleniyor...</span>
                </div>

                <div id="cardsGrid" class="cards-grid">
                    <!-- Kartlar buraya JS ile yüklenecek -->
                </div>
            </div>
        </main>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
